<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <h1>Authors</h1>

    <div style="margin-bottom: 20px;">
        <a href="/api/books" class="btn">Books</a>
        <a href="/api/members" class="btn">Members</a>
    </div>

    <a href="/api/authors/new" class="btn">+ Add New Author</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Country</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="author : ${authors}">
            <td th:text="${author.id}">1</td>
            <td th:text="${author.name}">Author Name</td>
            <td th:text="${author.country}">Country</td>
            <td>
                <a class="edit" th:href="@{/api/authors/edit/{id}(id=${author.id})}">Edit</a>
                <a class="delete" th:href="@{/api/authors/delete/{id}(id=${author.id})}" onclick="return confirm('Are you sure you want to delete this author?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(authors)}">No authors available.</p>
</div>
</body>
</html>
